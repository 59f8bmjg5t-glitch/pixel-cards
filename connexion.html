<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Pixel Cards</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b1020;
  color:white;
  min-height:100vh;
}

header{
  text-align:center;
  padding:35px 20px 20px;
}

header h1{
  margin:0;
  font-size:36px;
}

header p{
  color:#aeb8cc;
}

.container{
  max-width:450px;
  margin:30px auto;
  padding:20px;
}

.card{
  background:#151d35;
  border:1px solid #283352;
  border-radius:18px;
  padding:25px;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.tabs{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.tabs button{
  flex:1;
  padding:12px;
  border:0;
  border-radius:10px;
  cursor:pointer;
  background:#273252;
  color:white;
  font-weight:bold;
}

.tabs button.active{
  background:#6878ff;
}

.form{
  display:none;
}

.form.active{
  display:block;
}

label{
  display:block;
  margin:14px 0 7px;
  color:#cbd3e5;
}

input{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #394667;
  background:#0e1529;
  color:white;
  font-size:15px;
}

.main-button{
  width:100%;
  margin-top:20px;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#6878ff;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.main-button:hover{
  opacity:.9;
}

.message{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  display:none;
  text-align:center;
}

.success{
  display:block;
  background:#173d2c;
  color:#72e6a5;
}

.error{
  display:block;
  background:#421f28;
  color:#ff8798;
}

.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#61e6f5;
  text-decoration:none;
}
</style>
</head>

<body>

<header>
  <h1>🎴 Pixel Cards</h1>
  <p>Ton aventure commence ici</p>
</header>

<div class="container">

  <div class="card">

    <div class="tabs">
      <button id="loginTab" class="active">Connexion</button>
      <button id="signupTab">Inscription</button>
    </div>

    <!-- CONNEXION -->
    <div id="loginForm" class="form active">

      <label for="loginEmail">Adresse e-mail</label>

      <input
        type="email"
        id="loginEmail"
        placeholder="ton@email.com"
      >

      <label for="loginPassword">Mot de passe</label>

      <input
        type="password"
        id="loginPassword"
        placeholder="••••••••"
      >

      <button class="main-button" id="loginButton">
        Se connecter
      </button>

    </div>


    <!-- INSCRIPTION -->
    <div id="signupForm" class="form">

      <label for="signupUsername">Pseudo</label>

      <input
        type="text"
        id="signupUsername"
        placeholder="Ton pseudo"
        maxlength="30"
      >

      <label for="signupEmail">Adresse e-mail</label>

      <input
        type="email"
        id="signupEmail"
        placeholder="ton@email.com"
      >

      <label for="signupPassword">Mot de passe</label>

      <input
        type="password"
        id="signupPassword"
        placeholder="Minimum 6 caractères"
      >

      <button class="main-button" id="signupButton">
        Créer mon compte
      </button>

    </div>

    <div id="message" class="message"></div>

  </div>

  <a class="back" href="index.html">
    ← Retour à Pixel Cards
  </a>

</div>


<script>

const SUPABASE_URL =
  "https://nqeuvndxdgkyhgtizlwb.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_eiWdeN_r0EmFL8nhCoMH_w_WA82q10Z";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


const loginTab =
  document.getElementById("loginTab");

const signupTab =
  document.getElementById("signupTab");

const loginForm =
  document.getElementById("loginForm");

const signupForm =
  document.getElementById("signupForm");

const message =
  document.getElementById("message");


function showMessage(text, type){

  message.textContent = text;

  message.className =
    "message " + type;

}


/* =========================
   CHANGEMENT DE FORMULAIRE
========================= */

loginTab.addEventListener("click", () => {

  loginTab.classList.add("active");

  signupTab.classList.remove("active");

  loginForm.classList.add("active");

  signupForm.classList.remove("active");

  message.className = "message";

});


signupTab.addEventListener("click", () => {

  signupTab.classList.add("active");

  loginTab.classList.remove("active");

  signupForm.classList.add("active");

  loginForm.classList.remove("active");

  message.className = "message";

});


/* =========================
   CREATION DU PROFIL
========================= */

async function createPlayerProfile(user){

  if(!user){
    return;
  }

  const { data: existingPlayer, error: searchError } =
    await supabaseClient
      .from("players")
      .select("id")
      .eq("user_id", user.id)
      .maybeSingle();

  if(searchError){

    console.error(
      "Erreur recherche profil :",
      searchError
    );

    return;
  }


  if(existingPlayer){

    return;
  }


  const username =
    user.user_metadata?.username ||
    user.email?.split("@")[0] ||
    "Joueur";


  const { error: insertError } =
    await supabaseClient
      .from("players")
      .insert({

        user_id: user.id,

        username: username,

        coins: 500,

        xp: 0,

        level: 1,

        cards: [],

        boosters: 0,

        achievements: []

      });


  if(insertError){

    console.error(
      "Erreur création profil :",
      insertError
    );

    showMessage(
      "Le compte est connecté, mais le profil n'a pas pu être créé.",
      "error"
    );

    return;
  }

}


/* =========================
   VERIFICATION SESSION
========================= */

async function checkSession(){

  const {
    data: {
      session
    }
  } = await supabaseClient.auth.getSession();


  if(session && session.user){

    await createPlayerProfile(
      session.user
    );

  }

}


checkSession();


/* =========================
   CONNEXION
========================= */

document
  .getElementById("loginButton")
  .addEventListener("click", async () => {


    const email =
      document
        .getElementById("loginEmail")
        .value
        .trim();


    const password =
      document
        .getElementById("loginPassword")
        .value;


    if(!email || !password){

      showMessage(
        "Remplis tous les champs.",
        "error"
      );

      return;
    }


    const {
      data,
      error
    } =
      await supabaseClient.auth.signInWithPassword({

        email: email,

        password: password

      });


    if(error){

      showMessage(
        error.message,
        "error"
      );

      return;
    }


    await createPlayerProfile(
      data.user
    );


    showMessage(
      "Connexion réussie ! Redirection...",
      "success"
    );


    setTimeout(() => {

      window.location.href =
        "profil.html";

    }, 1000);

});


/* =========================
   INSCRIPTION
========================= */

document
  .getElementById("signupButton")
  .addEventListener("click", async () => {


    const username =
      document
        .getElementById("signupUsername")
        .value
        .trim();


    const email =
      document
        .getElementById("signupEmail")
        .value
        .trim();


    const password =
      document
        .getElementById("signupPassword")
        .value;


    if(!username || !email || !password){

      showMessage(
        "Remplis tous les champs.",
        "error"
      );

      return;
    }


    if(password.length < 6){

      showMessage(
        "Le mot de passe doit contenir au moins 6 caractères.",
        "error"
      );

      return;
    }


    const {
      data,
      error
    } =
      await supabaseClient.auth.signUp({

        email: email,

        password: password,

        options: {

          emailRedirectTo:
            "https://59f8bmjg5t-glitch.github.io/pixel-cards/connexion.html",

          data: {

            username: username

          }

        }

      });


    if(error){

      showMessage(
        error.message,
        "error"
      );

      return;
    }


    if(!data.user){

      showMessage(
        "Impossible de créer le compte.",
        "error"
      );

      return;
    }


    /*
      Avec la confirmation e-mail activée,
      le joueur doit confirmer son adresse
      avant d'être connecté.

      Le profil sera créé automatiquement
      lorsqu'il reviendra sur cette page.
    */


    if(!data.session){

      showMessage(
        "Compte créé ! Vérifie ton e-mail pour confirmer ton compte.",
        "success"
      );

      return;
    }


    /*
      Si la confirmation e-mail n'est pas
      nécessaire, le profil est créé immédiatement.
    */

    await createPlayerProfile(
      data.user
    );


    showMessage(
      "Compte créé avec succès !",
      "success"
    );

  });

</script>

</body>
</html>
