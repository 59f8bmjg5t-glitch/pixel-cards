<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profil — Pixel Cards</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(180deg,#10152b,#080b18);
  color:white;
  text-align:center;
}

header{
  padding:25px 15px;
  background:rgba(0,0,0,.35);
}

header h1{
  margin:0 0 10px;
  font-size:32px;
}

header p{
  margin:0;
  color:#cfd5ff;
}

nav{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  padding:15px;
  background:#090d1d;
}

nav a{
  color:white;
  text-decoration:none;
  padding:10px 14px;
  border-radius:10px;
  background:#1b2344;
}

nav a:hover{
  background:#2b376d;
}

main{
  max-width:800px;
  margin:auto;
  padding:30px 20px 50px;
}

.profile-card{
  background:linear-gradient(145deg,#252e5b,#12172f);
  border:2px solid #5968c7;
  border-radius:25px;
  padding:30px 20px;
  box-shadow:0 15px 40px rgba(0,0,0,.35);
}

.avatar{
  width:90px;
  height:90px;
  margin:0 auto 15px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#6878ff;
  font-size:45px;
}

.level{
  font-size:28px;
  font-weight:bold;
  margin-bottom:10px;
}

.xp-text{
  color:#cfd5ff;
  margin-bottom:10px;
}

.xp-bar{
  width:100%;
  height:20px;
  background:#080b18;
  border-radius:20px;
  overflow:hidden;
  border:2px solid #414d91;
}

.xp-progress{
  height:100%;
  width:0%;
  background:#6878ff;
  transition:width .4s ease;
}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  margin-top:25px;
}

.stat{
  padding:20px;
  background:rgba(255,255,255,.06);
  border-radius:15px;
}

.stat strong{
  display:block;
  font-size:26px;
  margin-bottom:5px;
}

.stat span{
  color:#b9c0e8;
}

footer{
  padding:25px;
  color:#9da5cc;
  font-size:14px;
}

@media(max-width:600px){
  .stats{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>👤 Profil Pixel Cards</h1>
  <p>Ta progression dans l'univers Pixel Cards</p>
</header>

<nav>
  <a href="index.html">Accueil</a>
  <a href="saison.html">Saison 1</a>
  <a href="booster.html">🎁 Booster</a>
  <a href="collection.html">Collection</a>
  <a href="economie.html">🪙 Économie</a>
  <a href="profil.html">👤 Profil</a>
</nav>

<main>

  <div class="profile-card">

    <div class="avatar">🎮</div>

    <div class="level" id="level">
      Niveau 1
    </div>

    <div class="xp-text">
      <span id="xp">0</span> / <span id="xpMax">100</span> XP
    </div>

    <div class="xp-bar">
      <div class="xp-progress" id="xpProgress"></div>
    </div>

    <div class="stats">

      <div class="stat">
        <strong id="coins">0</strong>
        <span>🪙 Pixel Coins</span>
      </div>

      <div class="stat">
        <strong id="cards">0</strong>
        <span>🃏 Cartes débloquées</span>
      </div>

      <div class="stat">
        <strong id="boosters">0</strong>
        <span>🎁 Boosters ouverts</span>
      </div>

      <div class="stat">
        <strong id="bestTime">—</strong>
        <span>⚡ Meilleur temps</span>
      </div>

    </div>

  </div>

</main>

<footer>
  © 2026 Pixel Cards — Univers original. Saison 01 : Winter Pixels.
</footer>

<script>

const COINS_KEY = "pixelCoins";
const CARDS_KEY = "pixelCardsUnlocked";
const BEST_TIME_KEY = "pixelRapiditeBest";

function getCoins(){
  return Number(localStorage.getItem(COINS_KEY)) || 0;
}

function getCards(){
  const cards = JSON.parse(localStorage.getItem(CARDS_KEY) || "[]");
  return cards.length;
}

function getLevelData(){

  const xp = Number(localStorage.getItem("pixelXP")) || 0;

  let level = 1;
  let remainingXP = xp;
  let xpMax = 100;

  while(remainingXP >= xpMax){
    remainingXP -= xpMax;
    level++;
    xpMax = level * 100;
  }

  return {
    level: level,
    xp: remainingXP,
    xpMax: xpMax
  };
}

function updateProfile(){

  const data = getLevelData();

  document.getElementById("level").textContent =
    "Niveau " + data.level;

  document.getElementById("xp").textContent =
    data.xp;

  document.getElementById("xpMax").textContent =
    data.xpMax;

  document.getElementById("xpProgress").style.width =
    ((data.xp / data.xpMax) * 100) + "%";

  document.getElementById("coins").textContent =
    getCoins();

  document.getElementById("cards").textContent =
    getCards();

  const bestTime =
    localStorage.getItem(BEST_TIME_KEY);

  document.getElementById("bestTime").textContent =
    bestTime ? bestTime + " ms" : "—";

  document.getElementById("boosters").textContent =
    Number(localStorage.getItem("pixelBoostersOpened")) || 0;
}

updateProfile();

</script>

</body>
</html>
